name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - name: Lint
        run: uv run --locked ruff check .
      - name: Tests (scene tests that need Blender are skipped here)
        run: uv run --locked pytest -q

  browser:
    name: Page browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.13.0" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run --locked playwright install --with-deps chromium
      - run: uv run --locked pytest -q -m browser tests/browser
        env: { BSA_REQUIRE_BROWSER: "1" }

  plugin:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the plugin
        run: npx --yes @anthropic-ai/claude-code@2.1.296 plugin validate .
