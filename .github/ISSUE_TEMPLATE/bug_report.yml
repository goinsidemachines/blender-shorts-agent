name: Bug report
description: Something went wrong while making a short.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked for, what the plugin did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error or output
      description: The plain error line, or the `BSA_RESULT` line from a Blender command. Remove any paths or keys you'd rather not share.
      render: text
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      description: Where the short was (`CLI state SHORT` shows it).
      options:
        - first run / settings
        - interview, story or storyboard
        - narration
        - build
        - checks
        - preview or final render
        - frame-check or edit
        - post
        - not sure
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version, Blender version, operating system, GPU.
      placeholder: 0.1.0 · Blender 4.5 · Windows 11 · RTX 4070
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - script mode
        - MCP mode
