# Whisper small.en (OpenAI, MIT): the optional check that each take says its line.
[project]
name = "bsa-engine-whisper"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "transformers==5.2.0",
    "torch==2.11.0",
    "soundfile==0.14.0",
    "scipy==1.17.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
