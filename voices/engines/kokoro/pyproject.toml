# Kokoro-82M (Apache-2.0). Runs on an NVIDIA GPU or on the CPU.
[project]
name = "bsa-engine-kokoro"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro==0.9.4",
    "misaki[en]==0.9.4",
    "soundfile==0.14.0",
    "torch==2.11.0",
    "en_core_web_sm",
]

[tool.uv]
package = false

[tool.uv.sources]
# CUDA 12.8 builds on Windows and Linux (needed for RTX 50-series cards); the default PyPI build on macOS.
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
en_core_web_sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
