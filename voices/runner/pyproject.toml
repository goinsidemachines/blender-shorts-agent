[project]
name = "bsa-tts"
version = "0.1.0"
description = "Free local voices for blender-shorts-agent: one command for Kokoro, Chatterbox and Chatterbox Turbo"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
]

[project.scripts]
bsa-tts = "bsa_tts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bsa_tts"]
