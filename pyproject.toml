[project]
name = "bsa"
version = "0.3.0"
description = "Blender Shorts Agent: narrated vertical explainer shorts made in Blender"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bsa"]

[tool.pytest.ini_options]
testpaths = ["tests", "voices/runner/tests"]
markers = [
    "blender: test runs inside Blender (skipped when Blender is not found)",
    "slow: slow test (skipped unless run with -m slow)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
